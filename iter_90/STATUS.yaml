  source_conclusion: 'The router pay_to handler derives and verifies the deterministic pool from the supplied token pair before reading the custom payload. Only a payload with more than 32 bits and the cross_swap opcode enters nested routing; all other payload shapes, including a 32-bit boundary, use the ordinary one-sided token transfer and preserve the payload as user-selected metadata. The nested path reuses route_dex_messages validation and refunds on failure. Since the pool is the caller and the payload originates from the same user-requested route, no external actor can redirect a victim payout or create a forged pool-originated pay_to message.'
