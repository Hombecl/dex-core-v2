  source_conclusion: "Router’s notification entrypoint accepts an arbitrary sender as one pair endpoint, but the Pool StateInit and route builder hash-sort the two endpoint addresses. Pairing forged sender A with existing Router wallet B produces only the A/B pool’s first one-sided leg; completing the same pair requires a notification actually sent by B with A as the other wallet. A different forged sender C produces a different Pool. The initial Pool callback requires both accumulated legs positive before LP supply exists, and LP burn is sender/state-bound. The static pair model and live mint/burn regression found no initialized fake/real pair, real-wallet debit, victim loss, or attacker-positive delta. AR1 is a narrowed duplicate dead end of Iter51/68/102."
